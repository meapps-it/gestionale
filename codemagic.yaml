workflows:
  android-debug:
    name: Gestionale Nativo - APK
    max_build_duration: 60
    environment:
      java: 17

    scripts:
      - name: Crea progetto Android
        script: |
          mkdir -p app/src/main/java/com/meapps/gestionale
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Gestionale"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.meapps.gestionale"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.meapps.gestionale"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Gestionale"
                  android:theme="@style/Theme.Gestionale">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Gestionale" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#10182B</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/meapps/gestionale/MainActivity.kt <<'EOF'
          package com.meapps.gestionale

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.Menu
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          private val SystemTypography = Typography(
              bodyLarge = TextStyle(fontFamily = FontFamily.SansSerif),
              bodyMedium = TextStyle(fontFamily = FontFamily.SansSerif),
              bodySmall = TextStyle(fontFamily = FontFamily.SansSerif),
              titleLarge = TextStyle(fontFamily = FontFamily.SansSerif),
              titleMedium = TextStyle(fontFamily = FontFamily.SansSerif),
              titleSmall = TextStyle(fontFamily = FontFamily.SansSerif),
              labelLarge = TextStyle(fontFamily = FontFamily.SansSerif),
              labelMedium = TextStyle(fontFamily = FontFamily.SansSerif),
              labelSmall = TextStyle(fontFamily = FontFamily.SansSerif)
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(typography = SystemTypography) {
                          GestionaleApp()
                      }
                  }
              }
          }

          @Composable
          fun GestionaleApp() {
              var selected by remember { mutableIntStateOf(0) }

              Scaffold(
                  containerColor = Color(0xFFF6F7FB),
                  topBar = { Header() },
                  bottomBar = {
                      BottomAppBar(
                          containerColor = Color.White,
                          tonalElevation = 8.dp,
                          modifier = Modifier.navigationBarsPadding()
                      ) {
                          val items = listOf("Dashboard", "Articoli", "Clienti", "Ordini")
                          items.forEachIndexed { index, label ->
                              NavigationBarItem(
                                  selected = selected == index,
                                  onClick = { selected = index },
                                  icon = {},
                                  label = { Text(label, fontSize = 13.sp) },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = Color(0xFF10182B),
                                      selectedTextColor = Color(0xFF10182B),
                                      indicatorColor = Color(0xFFFFF0BF),
                                      unselectedTextColor = Color(0xFF424A5A)
                                  )
                              )
                          }
                      }
                  },
                  floatingActionButton = {
                      FloatingActionButton(
                          onClick = {},
                          containerColor = Color(0xFF2F66E8),
                          contentColor = Color.White
                      ) {
                          Icon(Icons.Default.Add, contentDescription = "Aggiungi")
                      }
                  }
              ) { padding ->
                  when (selected) {
                      0 -> Dashboard(Modifier.padding(padding))
                      1 -> Placeholder("Articoli", Modifier.padding(padding))
                      2 -> Placeholder("Clienti", Modifier.padding(padding))
                      else -> Placeholder("Ordini", Modifier.padding(padding))
                  }
              }
          }

          @Composable
          fun Header() {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(Color(0xFF10182B))
                      .padding(horizontal = 16.dp, vertical = 12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(
                      text = "Gestionale",
                      color = Color.White,
                      fontSize = 18.sp,
                      fontWeight = FontWeight.Bold,
                      modifier = Modifier.weight(1f)
                  )

                  IconButton(
                      onClick = {},
                      modifier = Modifier
                          .size(40.dp)
                          .background(Color(0xFF202B44), RoundedCornerShape(12.dp))
                  ) {
                      Icon(Icons.Default.Menu, contentDescription = "Menu", tint = Color.White)
                  }
              }
          }

          @Composable
          fun Dashboard(modifier: Modifier = Modifier) {
              Column(
                  modifier = modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(14.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Text(
                      text = "Dashboard",
                      fontSize = 22.sp,
                      fontWeight = FontWeight.Bold,
                      color = Color(0xFF111827)
                  )

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      StatCard(
                          title = "Ordini aperti",
                          value = "1",
                          subtitle = "da consegnare",
                          modifier = Modifier.weight(1f)
                      )

                      StatCard(
                          title = "Incasso mese",
                          value = "0,00 €",
                          subtitle = "mese corrente",
                          modifier = Modifier.weight(1f),
                          valueColor = Color(0xFF169447)
                      )
                  }

                  StatCard(
                      title = "Guadagno mese",
                      value = "0,00 €",
                      subtitle = "margine del mese corrente",
                      modifier = Modifier.fillMaxWidth(),
                      valueColor = Color(0xFF169447)
                  )

                  Text(
                      text = "Ultimi ordini",
                      fontSize = 18.sp,
                      fontWeight = FontWeight.Bold,
                      color = Color(0xFF111827),
                      modifier = Modifier.padding(top = 8.dp)
                  )

                  OrderRow("Ordine #1032", "Cliente prova", "In corso")
                  OrderRow("Ordine #1031", "Mario Rossi", "Consegnato")
                  OrderRow("Ordine #1030", "Laura Bianchi", "Consegnato")

                  Spacer(modifier = Modifier.height(72.dp))
              }
          }

          @Composable
          fun StatCard(
              title: String,
              value: String,
              subtitle: String,
              modifier: Modifier = Modifier,
              valueColor: Color = Color(0xFF111827)
          ) {
              Card(
                  modifier = modifier,
                  shape = RoundedCornerShape(18.dp),
                  colors = CardDefaults.cardColors(containerColor = Color.White),
                  elevation = CardDefaults.cardElevation(defaultElevation = 1.dp)
              ) {
                  Column(
                      modifier = Modifier
                          .heightIn(min = 96.dp)
                          .padding(12.dp),
                      verticalArrangement = Arrangement.spacedBy(4.dp)
                  ) {
                      Text(
                          text = title.uppercase(),
                          fontSize = 10.sp,
                          fontWeight = FontWeight.SemiBold,
                          color = Color(0xFF687385)
                      )
                      Text(
                          text = value,
                          fontSize = 22.sp,
                          fontWeight = FontWeight.Bold,
                          color = valueColor
                      )
                      Text(
                          text = subtitle,
                          fontSize = 11.sp,
                          color = Color(0xFF687385)
                      )
                  }
              }
          }

          @Composable
          fun OrderRow(title: String, customer: String, status: String) {
              Card(
                  shape = RoundedCornerShape(16.dp),
                  colors = CardDefaults.cardColors(containerColor = Color.White),
                  elevation = CardDefaults.cardElevation(defaultElevation = 1.dp),
                  modifier = Modifier.fillMaxWidth()
              ) {
                  Row(
                      modifier = Modifier.padding(12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(modifier = Modifier.weight(1f)) {
                          Text(title, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                          Text(customer, fontSize = 12.sp, color = Color(0xFF687385))
                      }
                      Text(
                          text = status,
                          fontSize = 12.sp,
                          fontWeight = FontWeight.SemiBold,
                          color = if (status == "In corso") Color(0xFFE79A00) else Color(0xFF169447)
                      )
                  }
              }
          }

          @Composable
          fun Placeholder(title: String, modifier: Modifier = Modifier) {
              Box(
                  modifier = modifier.fillMaxSize(),
                  contentAlignment = Alignment.Center
              ) {
                  Text(
                      text = "$title\nSchermata in preparazione",
                      fontSize = 22.sp
                  )
              }
          }
          EOF

      - name: Crea Gradle wrapper
        script: |
          gradle wrapper --gradle-version 8.9

      - name: Compila APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
